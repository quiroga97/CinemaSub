name: IPA sin firmar (instalación gratuita por sideload)

# Compila CinemaSubs en Release SIN firmar, lista para re-firmar con un Apple ID
# gratuito usando Sideloadly/AltStore en Windows. Ver docs/SIDELOAD_FREE.md.
#
# Coste: 0 € si el repo es público (runners macOS gratuitos en repos públicos).
# En repo privado consumen minutos del plan (macOS = multiplicador 10x).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: sideload-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          pnpm -v

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Verificar Xcode >= 26
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk '/^Xcode/ {print $2}' | cut -d. -f1)
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::Se requiere Xcode 26+ (imagen macos-latest debería traerlo)."
            exit 1
          fi

      - name: Caché de CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prebuild (autolinking de modules/cinema-native)
        run: pnpm exec expo prebuild --platform ios

      - name: Pod install (sincroniza sandbox con Podfile.lock)
        run: |
          set -euo pipefail
          cd ios
          ls Podfile* 2>/dev/null || true
          pod install

      - name: Archive Release sin firmar
        run: |
          set -euo pipefail
          cd ios
          ls -la
          # prebuild actual puede integrar pods SIN workspace: preferir workspace, si no proyecto
          TARGET_ARGS=()
          if WS=$(ls -d *.xcworkspace 2>/dev/null | head -1) && [ -n "$WS" ]; then
            TARGET_ARGS=(-workspace "$WS")
          elif PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1) && [ -n "$PROJ" ]; then
            TARGET_ARGS=(-project "$PROJ")
          else
            echo "::error::No se encontró xcworkspace ni xcodeproj en ios/"
            exit 1
          fi
          SCHEME=$(xcodebuild -list "${TARGET_ARGS[@]}" 2>/dev/null \
            | sed -n '/Schemes:/,$p' | tail -n +2 \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' | head -1)
          echo "target=${TARGET_ARGS[*]} scheme=$SCHEME"
          xcodebuild archive \
            "${TARGET_ARGS[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath ../build/CinemaSubs.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Empaquetar IPA sin firmar
        run: |
          set -euo pipefail
          ARCHIVE=$(find . -maxdepth 4 -name '*.xcarchive' -type d 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No se encontró xcarchive"
            find . -maxdepth 3 -type d -name build 2>/dev/null
            exit 1
          fi
          APP=$(find "$ARCHIVE" -name '*.app' -type d | head -1)
          echo "archive=$ARCHIVE app=$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry CinemaSubs-unsigned.ipa Payload
          ls -lh CinemaSubs-unsigned.ipa

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CinemaSubs-unsigned-ipa
          path: CinemaSubs-unsigned.ipa
          retention-days: 14
